services:
  hosted-api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/calls.sqlite3
    volumes:
      - hosted-call-data:/data
    expose:
      - "8080"
    networks:
      - call-control

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - hosted-api
    networks:
      - call-control

volumes:
  hosted-call-data:
  caddy-data:
  caddy-config:

networks:
  call-control:
