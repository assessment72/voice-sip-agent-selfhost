name: Hosted Call API tests

on:
  push:
    branches: [feature/hosted-call-api]
    paths:
      - "hosted-api/**"
      - ".github/workflows/hosted-api-ci.yml"
  pull_request:
    paths:
      - "hosted-api/**"
      - ".github/workflows/hosted-api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
