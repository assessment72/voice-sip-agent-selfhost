name: Android APK

on:
  push:
    branches:
      - feat/telegram-voice-fallback
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - '*.gradle'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: feat/telegram-voice-fallback

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Sign APK with repository keystore
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done

          if (( ${#missing[@]} == 4 )); then
            echo "::warning::Custom keystore secrets are unavailable to this workflow. Keeping the Gradle-generated installable debug APK signed with the temporary runner debug key."
            echo "mode=runner-debug-key" >> "$GITHUB_OUTPUT"
            {
              echo "### APK signing"
              echo "- Custom repository keystore: not available to this workflow."
              echo "- APK remains signed with the temporary GitHub runner debug key."
              echo "- To use your persistent key, add all four values under **Settings → Secrets and variables → Actions → Repository secrets**."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if (( ${#missing[@]} > 0 )); then
            printf 'Incomplete signing configuration. Missing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/voice-sip-agent-signing.keystore"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          keytool -list -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK_PATH"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/voice-sip-agent-signed.apk" \
            "$APK_PATH"

          mv "$RUNNER_TEMP/voice-sip-agent-signed.apk" "$APK_PATH"
          "$APKSIGNER" verify --verbose "$APK_PATH"
          keytool -printcert -jarfile "$APK_PATH" | grep -E 'Owner:|Issuer:|SHA256:'
          echo "mode=repository-keystore" >> "$GITHUB_OUTPUT"
          {
            echo "### APK signing"
            echo "- APK signed and verified with the repository keystore."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK output and checksum
        run: |
          set -euo pipefail
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          ls -lh app/build/outputs/apk/debug/*.apk
          sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voice-sip-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
