name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm-tests:
    # The JVM modules need no native pjsua2 build; the APK is built and signed locally for releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/mcp-adb-bridge/server.py
      - run: python -m unittest discover -s tools/mcp-adb-bridge -p 'test_*.py'
      - run: ./gradlew :voice-api:test :sip:test :gateway:test

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:compileDebugKotlin
