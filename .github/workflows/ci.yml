name: CI

on:
  push:
    branches: [main, feature/voicx-control-api-foundation, feature/direct-telegram-control-single-device, feature/telegram-simcall-balance-ussd]
  pull_request:

jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sip:test :gateway:test

  control-bridge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node control-bridge/smoke-test.mjs

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 20.0
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest

  android-debug-apk:
    name: Build and sign upgrade-compatible Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 20.0
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug
      - name: Sign APK with the persistent repository keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required signing secret $name is missing or unavailable to this workflow."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/upgrade-signing.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          APK_IN="app/build/outputs/apk/debug/app-debug.apk"
          APK_OUT="app/build/outputs/apk/debug/app-debug-signed.apk"
          test -s "$APK_IN"
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK_OUT" "$APK_IN"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_OUT"
          echo "=== Signing certificate SHA-256 ==="
          keytool -printcert -jarfile "$APK_OUT" | grep -E 'SHA256:|Owner:|Issuer:'
          echo "=== APK package identity ==="
          "$BUILD_TOOLS/aapt" dump badging "$APK_OUT" | grep -m1 "^package:"
          rm -f "$KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: voicx-control-signed-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug-signed.apk
          if-no-files-found: error
          retention-days: 14
