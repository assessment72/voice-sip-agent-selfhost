name: CI

on:
  push:
    branches: [main, feature/voicx-control-api-foundation, feature/direct-telegram-control-single-device, feature/telegram-simcall-balance-ussd]
  pull_request:

jobs:
  jvm-tests:
    # The JVM modules need no native pjsua2 build; the APK is built and signed locally for releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :sip:test :gateway:test

  control-bridge-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node control-bridge/smoke-test.mjs

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 20.0
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest

  android-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 20.0
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: voicx-control-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
