name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  jvm-tests:
    # The JVM modules need no native pjsua2 build; the APK is built and signed locally for releases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tools/mcp-adb-bridge/server.py
      - run: python -m unittest discover -s tools/mcp-adb-bridge -p 'test_*.py'
      - run: ./gradlew :voice-api:test :sip:test :gateway:test

  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:compileDebugKotlin
