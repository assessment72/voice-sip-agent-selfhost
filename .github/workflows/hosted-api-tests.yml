name: Hosted API tests

on:
  push:
    branches: [main, "feature/hosted-call-api"]
    paths:
      - "hosted-api/**"
      - ".github/workflows/hosted-api-tests.yml"
  pull_request:
    paths:
      - "hosted-api/**"
      - ".github/workflows/hosted-api-tests.yml"

permissions:
  contents: read

jobs:
  hosted-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: hosted-api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Hosted API tests
        run: python -m pytest -q
