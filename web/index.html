<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Voice SIP Agent · مكالمة مباشرة</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;max-width:34rem;margin:2rem auto;padding:0 1rem;line-height:1.7}
    main{border:1px solid #8886;border-radius:16px;padding:1.2rem}
    button{font:inherit;padding:.7rem 1.1rem;border-radius:10px;border:0;cursor:pointer}
    #status{white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body>
<main>
  <h1>مكالمة Voice SIP Agent</h1>
  <p>ابدأ مكالمة صوتية مباشرة. سيصل إشعار استلام إلى هاتف بوابة SIP عبر البوت الخاص.</p>
  <button id="start">بدء المكالمة</button>
  <p id="status">بانتظار فتح الصفحة من Telegram.</p>
</main>
<script>
(() => {
  const app = window.Telegram?.WebApp;
  const button = document.getElementById("start");
  const status = document.getElementById("status");
  if (app) { app.ready(); app.expand(); }
  else { status.textContent = "افتح هذه الصفحة من Telegram Mini App بعد نشرها وإعداد البوت."; button.disabled = true; }
  button.addEventListener("click", async () => {
    button.disabled = true;
    status.textContent = "جارٍ التحقق من Telegram وإنشاء غرفة الاتصال…";
    try {
      const response = await fetch("/api/room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ initData: app.initData })
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || "تعذر إنشاء المكالمة");
      status.textContent = "تم إنشاء الغرفة وإرسال دعوة للهاتف.\nرمز الغرفة: " + result.roomId +
        "\nانتهت صلاحية الدعوة بعد " + Math.round(result.expiresIn / 60) + " دقائق.\n" +
        "مرحلة التفاوض الصوتي ستبدأ بعد ربط عميل WebRTC في تحديث التطبيق.";
    } catch (error) {
      status.textContent = "تعذر بدء المكالمة: " + error.message;
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
