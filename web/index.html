<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Voice SIP Agent · مكالمة مباشرة</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body{font-family:system-ui,sans-serif;max-width:34rem;margin:2rem auto;padding:0 1rem;line-height:1.7}
    main{border:1px solid #8886;border-radius:16px;padding:1.2rem}
    button{font:inherit;padding:.7rem 1.1rem;border-radius:10px;border:0;cursor:pointer;margin-inline-end:.4rem}
    #status{white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body>
<main>
  <h1>مكالمة Voice SIP Agent</h1>
  <p>اتصال صوتي مباشر بين Telegram وهاتف بوابة SIP. لا تمر بيانات الصوت عبر خادم الإشارات.</p>
  <button id="start">بدء المكالمة</button>
  <button id="hangup" hidden>إنهاء المكالمة</button>
  <p id="status">بانتظار فتح الصفحة من Telegram.</p>
</main>
<script src="/app.js" defer></script>
</body>
</html>
